<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="referrer" content="same-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schema Query AI (v7)</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #fff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --user-bg: #2563eb;
      --assistant-bg: #fff;
      --radius: 16px;
      --font: system-ui, "Segoe UI", sans-serif;
      --mono: ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 1rem;
      margin: 0;
      white-space: nowrap;
    }
    .header select {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .header .btn-icon {
      padding: 8px 12px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      cursor: pointer;
    }
    .header .btn-icon:hover { background: var(--bg); }
    .status { font-size: 0.75rem; color: var(--muted); min-width: 48px; text-align: right; }
    .status .ok { color: #15803d; }
    .status .err { color: #dc2626; }
    .operator {
      font-size: 0.72rem;
      color: var(--muted);
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .operator.ok { color: #15803d; }
    .operator.err { color: #dc2626; }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; gap: 10px; max-width: 100%; }
    .msg-user { justify-content: flex-end; }
    .msg-user .msg-bubble {
      background: var(--user-bg);
      color: #fff;
      border-radius: 18px 18px 4px 18px;
      max-width: 85%;
    }
    .msg-assistant { align-items: flex-start; }
    .msg-avatar {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .msg-body { flex: 1; min-width: 0; max-width: 92%; }
    .msg-bubble {
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      padding: 14px 16px;
    }
    .msg-error { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    .msg-system {
      align-self: center;
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--bg);
      padding: 6px 14px;
      border-radius: 999px;
    }
    .msg-summary { margin: 0 0 8px; font-size: 0.95rem; }
    .msg-filter { margin: 0 0 10px; font-size: 0.85rem; color: var(--muted); }
    .msg-row-count {
      margin: 0 0 10px;
      font-size: 0.9rem;
      padding: 8px 12px;
      background: #ecfdf5;
      border-radius: 8px;
      color: #047857;
    }
    .msg-row-count strong { font-size: 1.15rem; font-weight: 700; }
    .msg-row-count.loading { background: var(--bg); color: var(--muted); }
    .msg-row-count.err { background: #fef2f2; color: #b91c1c; }
    .count-big {
      font-size: 2rem;
      font-weight: 700;
      color: #047857;
      margin: 8px 0;
    }
    .count-big span { font-size: 1rem; font-weight: 600; margin-left: 4px; }
    .warn-list { margin: 0 0 10px; padding-left: 18px; font-size: 0.82rem; color: #b45309; }

    .typing { display: inline-flex; gap: 4px; margin-right: 6px; vertical-align: middle; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin: 12px 0 8px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 14px;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .code {
      font-family: var(--mono);
      font-size: 0.78rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 280px;
      margin: 0 0 8px;
    }
    .sql-code {
      color: #0f766e;
      line-height: 1.55;
      max-height: 420px;
    }
    .hint { font-size: 0.82rem; color: var(--muted); margin: 0 0 8px; }

    .btn {
      font: inherit;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; }
    .btn-outline {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { background: var(--bg); }

    .save-panel {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .save-panel p { margin: 0 0 8px; font-size: 0.9rem; }
    .save-title {
      width: 100%;
      font: inherit;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .save-actions { display: flex; gap: 8px; }
    .save-done { margin: 12px 0 0; color: #15803d; font-size: 0.9rem; font-weight: 600; }
    .save-err { margin: 0 0 8px; color: #b91c1c; font-size: 0.85rem; }

    .composer {
      flex-shrink: 0;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .composer-options {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .composer-options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .composer-options input[type="checkbox"] { margin: 0; }
    .composer-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #chatInput {
      flex: 1;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      line-height: 1.4;
    }
    #chatInput:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    #btnSend {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      padding: 0;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    details summary { cursor: pointer; font-size: 0.82rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Query AI v7</h1>
      <select id="schemaSelect">
        <option value="">스키마 불러오는 중…</option>
      </select>
      <button type="button" class="btn-icon" id="btnRefreshSchemas" title="새로고침">↻</button>
      <button type="button" class="btn-icon" id="btnClearChat" title="대화 초기화">Clear</button>
      <div class="operator" id="operatorStatus" title="접속 계정">…</div>
      <div class="status" id="schemaStatus"></div>
    </header>

    <main class="chat" id="chat"></main>

    <footer class="composer">
      <div class="composer-options">
        <span>Enter 전송</span>
      </div>
      <div class="composer-row">
        <textarea id="chatInput" rows="1" placeholder="조건을 말로 입력하세요…" disabled></textarea>
        <button type="button" class="btn" id="btnSend" title="전송" disabled>↑</button>
      </div>
    </footer>
  </div>

  <script>
    // 실제 값은 old_ver/secrets/OLD_VER_SECRETS.md 참조 (git 제외)
    var SCHEMA_QUERY_TOKEN = "__SQ_TOKEN__";
    (function () {
      var s = document.createElement("script");
      s.charset = "UTF-8";
      s.src =
        "/uplus/bootstrap.jssp?_token=" + encodeURIComponent(SCHEMA_QUERY_TOKEN);
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
